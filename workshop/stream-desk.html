<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bloodline Stream Desk</title><style>:root{color-scheme:dark}body{max-width:680px;margin:42px auto;padding:0 22px;background:#07111a;color:#d6edf7;font:16px Arial,sans-serif}h1{font:36px Georgia,serif;margin-bottom:4px}.eyebrow{color:#ffb24a;font-size:11px;font-weight:bold;letter-spacing:.16em;text-transform:uppercase}.card{margin-top:24px;padding:22px;border:1px solid #377b9f;background:#0a1d2a}label{display:block;margin:16px 0 6px;color:#8fafbe;font-size:12px;text-transform:uppercase;letter-spacing:.08em}input{width:100%;padding:11px;border:1px solid #377b9f;background:#061018;color:#d6edf7;font:inherit}button{margin:16px 8px 0 0;padding:12px 16px;border:1px solid #57c7ff;background:#0d344a;color:#d6edf7;font-weight:bold;cursor:pointer}button.primary{border-color:#ffb24a;background:#ffb24a;color:#061018}#status{margin-top:22px;color:#8fafbe;line-height:1.7}.changes{margin:12px 0 0;padding:0;list-style:none;border-top:1px solid #377b9f}.changes li{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid #21485e}.gain{color:#75d99b}.loss{color:#e88b8b}</style></head><body><p class="eyebrow">Local only · no prose leaves your machine</p><h1>Bloodline Stream Desk</h1><div class="card"><p>The session gain is the change across the entire Episodes folder.</p><label for="minutes">Sprint length in minutes</label><input id="minutes" type="number" min="1" value="25"><button class="primary" id="start">Start sprint</button><button id="break">Start break</button><button id="end">End sprint</button><div id="status">Connecting…</div></div><script>const $=id=>document.getElementById(id),signed=n=>`${n>=0?'+':''}${n.toLocaleString()}`;async function status(){try{const s=await fetch('/api/status',{cache:'no-store'}).then(r=>r.json()),changes=s.sprint.episodeDeltas||[];$('status').innerHTML=`<b>${s.phase.toUpperCase()}</b><br>Most recently changed · Episode ${s.activeEpisode??'—'}<br>Novel · ${s.novelWords.toLocaleString()} words<br>Session delta · ${signed(s.sprint.deltaWords)} words${changes.length?`<ul class="changes">${changes.map(c=>`<li><span>Episode ${c.number}</span><b class="${c.deltaWords>=0?'gain':'loss'}">${signed(c.deltaWords)} words</b></li>`).join('')}</ul>`:'<p>No episode changes yet this sprint.</p>'}`}catch{$('status').textContent='Stream Desk is unavailable.'}}async function post(path,body={}){await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});status()}$('start').onclick=()=>post('/api/sprint/start',{minutes:+$('minutes').value});$('break').onclick=()=>post('/api/sprint/break');$('end').onclick=()=>post('/api/sprint/end');status();setInterval(status,1000)</script></body></html>
